name: Package unsigned desktop

# 2026-09-20 coder(lq): fork-friendly unsigned desktop packages without signing credentials.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package-unsigned:
    name: unsigned ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-latest
            package-script: package:mac:arm64:unsigned
            artifact-name: dsh-desktop-mac-arm64-unsigned
          - target: mac-x64
            runner: macos-15-intel
            package-script: package:mac:x64:unsigned
            artifact-name: dsh-desktop-mac-x64-unsigned
          - target: win-x64
            runner: windows-2025
            package-script: package:win:x64:unsigned
            artifact-name: dsh-desktop-win-x64-unsigned

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write unsigned macOS packaging env
        if: runner.os == 'macOS'
        run: |
          # 2026-09-20 coder(lq): keep test auth, but do not poll official harness-test (401 + Feishu overlay white-screens unsigned Mac builds).
          cat > apps/desktop/.env.macos <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY=
          DSH_DESKTOP_MACOS_TEAM_ID=
          CSC_LINK=
          CSC_KEY_PASSWORD=
          EOF

      - name: Write unsigned Windows packaging env
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          '@ | Set-Content -Path apps/desktop/.env.windows -Encoding utf8NoBOM

      - name: Package unsigned desktop target
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.package-script }}

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*
          retention-days: 14
