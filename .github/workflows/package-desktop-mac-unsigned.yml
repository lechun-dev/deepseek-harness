name: Package unsigned desktop

# 2026-09-20 coder(lq): fork-friendly unsigned desktop packages without signing credentials.
on:
  push:
    tags: ['dsh-v*-lechun.*']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package-unsigned:
    name: unsigned ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-latest
            package-script: package:mac:arm64:unsigned
            artifact-name: dsh-desktop-mac-arm64-unsigned
            artifact-pattern: '*.dmg'
          - target: mac-x64
            runner: macos-15-intel
            package-script: package:mac:x64:unsigned
            artifact-name: dsh-desktop-mac-x64-unsigned
            artifact-pattern: '*.dmg'
          - target: win-x64
            runner: windows-2025
            package-script: package:win:x64:unsigned
            artifact-name: dsh-desktop-win-x64-unsigned
            artifact-pattern: '*.exe'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write unsigned macOS packaging env
        if: runner.os == 'macOS'
        run: |
          # 2026-09-20 coder(lq): keep test auth, but do not poll official harness-test (401 + Feishu overlay white-screens unsigned Mac builds).
          cat > apps/desktop/.env.macos <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.example.com"]}
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY=
          DSH_DESKTOP_MACOS_TEAM_ID=
          CSC_LINK=
          CSC_KEY_PASSWORD=
          EOF

      - name: Write unsigned Windows packaging env
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.example.com"]}
          '@ | Set-Content -Path apps/desktop/.env.windows -Encoding utf8NoBOM

      - name: Package unsigned desktop target
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.package-script }}

      - name: Keep macOS installer artifacts only
        if: runner.os == 'macOS'
        run: |
          artifact_dir="apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          find "$artifact_dir" -type f ! -name '*.dmg' -delete
          find "$artifact_dir" -maxdepth 1 -type f -print

      - name: Keep Windows installer artifacts only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactDir = "apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          # 2026-09-24 coder(lq): electron-builder needs an unpacked staging tree, but release artifacts only retain installers.
          Get-ChildItem -Path $artifactDir | Where-Object { $_.PSIsContainer -or $_.Extension -ine '.exe' } | Remove-Item -Recurse -Force
          $installers = @(Get-ChildItem -Path $artifactDir -File -Filter '*.exe')
          if ($installers.Count -eq 0) { throw "No Windows installer was produced in $artifactDir" }
          $installers | ForEach-Object { $_.FullName }

      # Packaging already packs every dsh and vendored tarball for its own
      # runtime; uploading that same set makes one run yield an installable CLI,
      # so another machine needs no checkout and no local build. The tarballs
      # carry JavaScript only: native dependencies resolve from the registry at
      # install time, so one target's set installs on any architecture.
      - name: Write CLI package set instructions
        if: matrix.target == 'mac-arm64'
        run: |
          packed_dir="apps/desktop/.desktop-build/targets/${{ matrix.target }}/packed"
          cat > "$packed_dir/INSTALL.txt" <<'EOF'
          DeepSeek Harness CLI package set, packed from this run's commit.

          Unzip this artifact and run one command:

            ./install.sh

          It installs into the shared Harness home (override with DSH_CLI_PREFIX)
          and points this machine's `dsh` at that installation, recording the
          previous target for rollback.

          Start the shared Web service with `dsh web`; a desktop build of the
          same commit then attaches to it instead of serving its own socket.
          EOF
          cat > "$packed_dir/install.sh" <<'SH'
          #!/bin/sh
          # Install this packed DeepSeek Harness CLI and make it the machine's
          # `dsh`. Run from the directory holding dsh/, vendor/, and landlock/.
          set -eu

          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          prefix=${DSH_CLI_PREFIX:-"$HOME/.dsh/cli"}
          node=${DSH_CLI_NODE:-node}

          command -v npm >/dev/null 2>&1 || { echo "install.sh: npm is required" >&2; exit 1; }
          command -v "$node" >/dev/null 2>&1 || { echo "install.sh: node is required" >&2; exit 1; }

          # Absolute tarball paths: npm reads a relative `dsh/x.tgz` as a GitHub shorthand.
          npm install --prefix "$prefix" --no-audit --no-fund --package-lock=false \
            "$here"/vendor/*.tgz "$here"/dsh/*.tgz "$here"/landlock/*.tgz

          entry="$prefix/node_modules/@deepseek-ai/dsh/lib/bin.js"
          [ -f "$entry" ] || { echo "install.sh: $entry is missing after install" >&2; exit 1; }
          echo "version: $("$node" "$entry" --version)"

          current=$(command -v dsh || true)
          if [ -n "$current" ]; then
            if [ -L "$current" ]; then
              previous=$(readlink "$current")
              printf 'symlink %s\n' "$previous" > "$prefix/previous-dsh-target"
              rollback="ln -sfn '$previous' '$current'"
            else
              # A regular file (not an npm link) is preserved, never overwritten silently.
              backup="$prefix/previous-dsh-file"
              cp -p "$current" "$backup"
              printf 'file %s\n' "$backup" > "$prefix/previous-dsh-target"
              rollback="rm -f '$current' && cp -p '$backup' '$current'"
            fi
            ln -sfn "$entry" "$current"
            echo "dsh: $current -> $entry"
            echo "rollback: $rollback"
          else
            mkdir -p "$prefix/bin"
            ln -sfn "$entry" "$prefix/bin/dsh"
            echo "no dsh on PATH; add $prefix/bin to PATH (or link $entry yourself)"
          fi
          SH
          chmod 755 "$packed_dir/install.sh"

      - name: Upload CLI package set
        if: matrix.target == 'mac-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-cli-unsigned
          if-no-files-found: error
          path: |
            apps/desktop/.desktop-build/targets/mac-arm64/packed/dsh/*.tgz
            apps/desktop/.desktop-build/targets/mac-arm64/packed/vendor/*.tgz
            apps/desktop/.desktop-build/targets/mac-arm64/packed/landlock/*.tgz
            apps/desktop/.desktop-build/targets/mac-arm64/packed/INSTALL.txt
            apps/desktop/.desktop-build/targets/mac-arm64/packed/install.sh
          retention-days: 14

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/${{ matrix.artifact-pattern }}
          retention-days: 14
