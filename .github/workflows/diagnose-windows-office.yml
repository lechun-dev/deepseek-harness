name: Diagnose Windows Office engine

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/diagnose-windows-office.yml
      - apps/desktop/tests/fixtures/office-engine-diagnostic.mjs
      - apps/desktop/tests/fixtures/office-engine-junction-probe.mjs
      - apps/desktop/tests/fixtures/office-engine-paths.test.mjs
      - patches/@deepseek-ai__libreoffice-kit@0.0.1.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        layout: [short, packaged, neutral-long, relocated-short, junction-short, patched]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exercise published native engine without Electron
        shell: pwsh
        env:
          DIAGNOSTIC_LAYOUT: ${{ matrix.layout }}
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          $packagedRelative = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources/app.asar.unpacked/dsh'
          $packaged = Join-Path $env:GITHUB_WORKSPACE $packagedRelative
          $root = switch ($env:DIAGNOSTIC_LAYOUT) {
            'short' { Join-Path $scratch 'app' }
            'neutral-long' { Join-Path $env:GITHUB_WORKSPACE ($packagedRelative -replace '[^/]', 'x') }
            default { $packaged }
          }
          if ($env:DIAGNOSTIC_LAYOUT -eq 'neutral-long' -and $root.Length -ne $packaged.Length) {
            throw 'Neutral control must match packaged path length'
          }
          New-Item -ItemType Directory -Force $scratch, $root | Out-Null
          try {
            npm install --prefix $root --ignore-scripts --no-audit --no-fund @deepseek-ai/libreoffice-kit@0.0.1
            if ($LASTEXITCODE -ne 0) { throw 'Office engine installation failed' }
            if ($env:DIAGNOSTIC_LAYOUT -eq 'relocated-short') {
              $relocated = Join-Path $scratch 'app'
              Copy-Item -LiteralPath $root -Destination $relocated -Recurse
              $root = $relocated
            }
            if ($env:DIAGNOSTIC_LAYOUT -eq 'junction-short') {
              node apps/desktop/tests/fixtures/office-engine-junction-probe.mjs $root
              if ($LASTEXITCODE -ne 0) { throw 'Native junction probe installation failed' }
            }
            if ($env:DIAGNOSTIC_LAYOUT -eq 'patched') {
              $kit = Join-Path $root 'node_modules/@deepseek-ai/libreoffice-kit'
              $patch = Join-Path $env:GITHUB_WORKSPACE 'patches/@deepseek-ai__libreoffice-kit@0.0.1.patch'
              $kitRelative = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $kit).Replace('\', '/')
              git apply --no-index --directory=$kitRelative $patch
              if ($LASTEXITCODE -ne 0) { throw 'Production patch application failed' }
              if (!(Test-Path (Join-Path $kit 'lib/native-paths.js'))) { throw 'Patched native helper is missing' }
              $env:DSH_OFFICE_KIT_DIRECTORY = $kit
              node --test apps/desktop/tests/fixtures/office-engine-paths.test.mjs
              if ($LASTEXITCODE -ne 0) { throw 'Native alias lifecycle tests failed' }
            }
            Write-Host "Office layout=$env:DIAGNOSTIC_LAYOUT rootLength=$($root.Length) root=$root"
            python -m venv (Join-Path $scratch 'python')
            if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed' }
            $python = Join-Path $scratch 'python/Scripts/python.exe'
            & $python -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2
            if ($LASTEXITCODE -ne 0) { throw 'Fixture dependencies failed' }
            & $python apps/desktop/tests/fixtures/office-conversion-inputs.py $scratch
            if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
            node apps/desktop/tests/fixtures/office-engine-diagnostic.mjs $root $scratch
            if ($LASTEXITCODE -ne 0) { throw 'Native Office diagnostic failed; see conversion output' }
          } finally {
            Remove-Item -Recurse -Force $scratch
          }
